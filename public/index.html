<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคิว MU Shooting Club</title>
    <link rel="icon" type="image/png" href="mushlogo.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@100..700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <!-- ส่วนที่ 1: หน้าลงทะเบียน -->
    <div id="viewRegister" class="container">
        <button class="admin-btn-corner" onclick="openAdmin()">⚙️ Admin</button>
        <img src="mushlogo.png" alt="Club's logo" width="100">
        <h1>🎯 ลงทะเบียนคิว</h1>
        <h1 id="clubname">MU Shooting Club</h1>
        <h4>Queuing System for MU Shooting Club</h4>
        <form id="registerForm">
            <input type="text" id="name" placeholder="ชื่อเล่น/Nickname" required>
            <select id="gunType" required>
                <option value="" selected disabled>ประเภทปืน/Gun Type</option>
                <option value="ปืนสั้น">ปืนสั้น/Air Pistol</option>
                <option value="ปืนยาว">ปืนยาว/Air Rifle</option>
            </select>
            <select id="round" required>
                <option value="" selected disabled>รอบที่ยิง/Round</option>
                <option value="1">รอบที่ 1/Round 1</option>
                <option value="2">รอบที่ 2/Round 2</option>
            </select>
            <button type="submit" id="btnSubmit">OK</button>
        </form>
    </div>

    <!-- ส่วนที่ 2: หน้าติดตามสถานะคิว (สำหรับผู้เข้าร่วม) -->
    <div id="viewUserStatus" class="container hidden" style="text-align: center;">
        <h2 style="color: #2980b9;">📡 สถานะคิวของคุณ</h2>
        <div style="background: #ecf0f1; padding: 20px; border-radius: 10px; margin: 15px 0;">
            <h1 id="userQId" style="font-size: 54px; color: #e74c3c; margin: 10px 0;">-</h1>
            <h3 id="userQGunType" style="margin: 5px 0;">-</h3>
        </div>
        <h3 id="userQStatus" style="color: #f39c12;">สถานะ: กำลังโหลด...</h3>
        <p id="userQWaitCount" style="font-size: 18px; color: #7f8c8d;">-</p>
        
        <p style="font-size: 13px; color: #95a5a6; margin-top: 20px;">*หน้านี้จะอัปเดตอัตโนมัติ ไม่ต้องกดรีเฟรช</p>
        <button onclick="location.reload()" style="background: #bdc3c7; margin-top: 10px; color: #333;">⬅ ลงทะเบียนให้เพื่อน (เริ่มใหม่)</button>
    </div>

    <!-- ส่วนที่ 3: หน้าแอดมิน -->
    <div id="viewAdmin" class="container hidden">
        <h2 style="color: #e74c3c;">🔒 จัดการคิว (STAFF ONLY)</h2>
        <button onclick="backToRegister()" style="background: #95a5a6; margin-bottom: 15px;">⬅ กลับสู่หน้าลงทะเบียน</button>
        
        <div class="qr-box">
            <h3 style="margin: 0 0 5px 0; color: #2c3e50;">🖨️ QR Code ให้ Walk-in สแกน</h3>
            <div id="adminQRCode"></div>
            <button onclick="generateAdminQR()" style="background: #3dba3d; width: auto; padding: 6px 12px; font-size: 13px;">รีเฟรช QR Code</button>
        </div>

        <div class="queue-box">
            <div class="queue-col">
                <h3 style="color: #a31fc1; margin-top:0;">📌 คิวปืนสั้น</h3>
                <div id="shortQueueList">กำลังโหลด...</div>
            </div>
            <div class="queue-col">
                <h3 style="color: #449bad; margin-top:0;">📌 คิวปืนยาว</h3>
                <div id="longQueueList">กำลังโหลด...</div>
            </div>
        </div>
        <button onclick="resetData()" style="background: #e74c3c; margin-top: 20px;">รีเซ็ตข้อมูลทั้งหมด</button>
    </div>

    <script>
        let myQueueId = null;
        let myGunType = null;
        var count = 0;

        window.onload = function() {
            if (sessionStorage.getItem('currentView') === 'admin') {
                document.getElementById('viewRegister').classList.add('hidden');
                document.getElementById('viewAdmin').classList.remove('hidden');
                fetchAllQueues();
                setTimeout(generateAdminQR, 500);
            }
        };

        function openAdmin() {
            const password = prompt('กรอก Password (STAFF ONLY):');
            if (password === 'shooting888') {
                document.getElementById('viewRegister').classList.add('hidden');
                document.getElementById('viewAdmin').classList.remove('hidden');
                sessionStorage.setItem('currentView', 'admin');
                count = 0;
                fetchAllQueues();
                setTimeout(generateAdminQR, 500); 
            } else if (password !== null) {
                count += 1;
                if (count === 1) alert('รหัสผ่านไม่ถูกต้อง!');
                else if (count === 2) alert('เอ๊ะ! ผิดอีกแล้วนะ...ลองคิดดี ๆ');
                else if (count === 3) alert('ครั้งที่ 4 นี่อย่าให้มีนะ');
                else if (count >= 4) alert('ไม่ใช่ละ ๆ นี่มันตัวปลอม!');
            }
        }

        function backToRegister() {
            document.getElementById('viewAdmin').classList.add('hidden');
            document.getElementById('viewRegister').classList.remove('hidden');
            sessionStorage.removeItem('currentView');
        }

        function generateAdminQR() {
            const qrContainer = document.getElementById('adminQRCode');
            if (!qrContainer) return;
            qrContainer.innerHTML = ''; 
            
            let currentUrl = window.location.href;
            if (currentUrl.includes('index.html')) {
                currentUrl = currentUrl.replace('index.html', '');
            }
            
            new QRCode(qrContainer, {
                text: currentUrl,
                width: 160,
                height: 160,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        // กดลงทะเบียน
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const gunType = document.getElementById('gunType').value;
            const round = document.getElementById('round').value;

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = 'กำลังโหลด...';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, gunType, round })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // จำข้อมูลคิวของตัวเองไว้ในตัวแปร
                    myQueueId = data.qId;
                    myGunType = gunType;
                    
                    // เปลี่ยนหน้าไปโชว์สถานะ
                    document.getElementById('viewRegister').classList.add('hidden');
                    document.getElementById('viewUserStatus').classList.remove('hidden');

                    fetchAllQueues(); // ดึงข้อมูลทันที
                }
            } catch (error) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์');
            } finally {
                btn.disabled = false;
                btn.innerText = 'OK';
            }
        });

        // ดึงข้อมูลกลางสำหรับทุกคน (เรียกทุกๆ 2 วินาที)
        async function fetchAllQueues() {
            try {
                const response = await fetch('/api/queues');
                const queues = await response.json();
                
                // อัปเดตหน้าแอดมิน (ถ้าเปิดอยู่)
                if (!document.getElementById('viewAdmin').classList.contains('hidden')) {
                    updateAdminUI(queues);
                }
                
                // อัปเดตหน้า User (ถ้าเปิดอยู่)
                if (!document.getElementById('viewUserStatus').classList.contains('hidden') && myQueueId) {
                    updateUserStatusUI(queues);
                }
            } catch (error) {
                console.error('Error fetching queues:', error);
            }
        }

        // ฟังก์ชันวาดหน้าแอดมิน
        function updateAdminUI(queues) {
            const shortList = document.getElementById('shortQueueList');
            const longList = document.getElementById('longQueueList');
            shortList.innerHTML = '';
            longList.innerHTML = '';

            let hasShort = false;
            let hasLong = false;

            queues.forEach((q) => {
                if (q.status === 'เสร็จสิ้น') return;

                const item = document.createElement('div');
                item.className = 'queue-item';
                // ใส่ single quote ครอบ q.id เพราะตอนนี้มันเป็นตัวอักษร (เช่น 'S1')
                item.innerHTML = `
                    <div>
                        <b>#${q.id}</b> ${q.name} <span class="badge">รอบ ${q.round}</span><br>
                        <small>สถานะ: <span style="color:${q.status === 'กำลังยิง' ? '#e67e22':'#27ae60'}">${q.status}</span></small>
                    </div>
                    <div>
                        <button class="btn-action btn-call" onclick="updateStatus('${q.id}', 'call')">${q.status === 'รอเรียก' ? 'เรียก' : 'เสร็จสิ้น'}</button>
                        <button class="btn-action btn-del" onclick="updateStatus('${q.id}', 'finish')">ข้าม/ลบ</button>
                    </div>
                `;

                if (q.gunType === 'ปืนสั้น') {
                    hasShort = true;
                    shortList.appendChild(item);
                } else {
                    hasLong = true;
                    longList.appendChild(item);
                }
            });

            if (!hasShort) shortList.innerHTML = '<p style="color:#7f8c8d; text-align:center;">ไม่มีคิวรอ</p>';
            if (!hasLong) longList.innerHTML = '<p style="color:#7f8c8d; text-align:center;">ไม่มีคิวรอ</p>';
        }

        // ฟังก์ชันวาดหน้าผู้เข้าร่วม (Live Tracking)
        function updateUserStatusUI(queues) {
            const q = queues.find(item => item.id === myQueueId);
            if (!q) return;

            document.getElementById('userQId').innerText = q.id;
            document.getElementById('userQGunType').innerText = `${q.gunType} - รอบที่ ${q.round}`;
            
            const statusEl = document.getElementById('userQStatus');
            const waitEl = document.getElementById('userQWaitCount');

            if (q.status === 'รอเรียก') {
                statusEl.innerHTML = `สถานะ: <span style="color:#e67e22;">กำลังรอคิว ⏳</span>`;
                // คำนวณคิวก่อนหน้า (เฉพาะปืนประเภทเดียวกันที่ยังรอเรียกอยู่)
                const waitingList = queues.filter(item => item.gunType === myGunType && item.status === 'รอเรียก');
                const myIndex = waitingList.findIndex(item => item.id === myQueueId);
                
                waitEl.innerText = `มีคิวก่อนหน้าคุณ: ${myIndex} คิว`;
                waitEl.style.color = '#7f8c8d';
            } else if (q.status === 'กำลังยิง') {
                statusEl.innerHTML = `สถานะ: <span style="color:#27ae60;">ถึงคิวของคุณแล้ว! 🎯</span>`;
                waitEl.innerText = 'โปรดติดต่อเจ้าหน้าที่ประจำช่องยิง';
                waitEl.style.color = '#27ae60';
            } else if (q.status === 'เสร็จสิ้น') {
                statusEl.innerHTML = `สถานะ: <span style="color:#bdc3c7;">เสร็จสิ้นแล้ว ✔️</span>`;
                waitEl.innerText = 'ขอบคุณที่เข้าร่วมกิจกรรมครับ';
                waitEl.style.color = '#7f8c8d';
            }
        }

        // กดอัปเดตสถานะคิว (ฝั่งแอดมิน)
        async function updateStatus(id, action) {
            await fetch('/api/status', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, action })
            });
            fetchAllQueues();
        }

        async function resetData() {
            if (confirm('ต้องการล้างข้อมูลคิวทั้งหมดใช่หรือไม่?')) {
                await fetch('/api/reset', { method: 'POST' });
                fetchAllQueues();
                alert('รีเซ็ตเรียบร้อยแล้ว');
            }
        }

        // ปิงเซิร์ฟเวอร์ทุกๆ 2 วินาทีเพื่ออัปเดตข้อมูลอัตโนมัติ
        setInterval(fetchAllQueues, 2000);
    </script>
</body>
</html>
